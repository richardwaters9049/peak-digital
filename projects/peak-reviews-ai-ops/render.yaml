services:
  - type: web
    name: peak-reviews-ai-ops-api
    runtime: docker
    rootDir: api
    plan: free
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: Peak Reviews AI Ops API
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: peak-reviews-ai-ops-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: peak-reviews-ai-ops-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: peak-reviews-ai-ops-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: peak-reviews-ai-ops-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: peak-reviews-ai-ops-db
          property: password
      - key: QUEUE_CONNECTION
        value: sync
      - key: OPENAI_MODEL
        value: gpt-4o-mini

databases:
  - name: peak-reviews-ai-ops-db
    plan: free

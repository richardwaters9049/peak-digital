name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate launcher
        run: bash -n scripts/docker_peakDigital

      - name: Build and test application
        env:
          OPEN_BROWSER: "0"
        run: scripts/docker_peakDigital test

      - name: Clean up Docker resources
        if: always()
        run: scripts/docker_peakDigital stop
